name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: |
          python3 -m pip install flake8 black --break-system-packages
      - name: Run flake8
        run: python3 -m flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203
      - name: Check code formatting
        run: python3 -m black --check src/ tests/
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages
      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov=src --cov-report=term-missing
